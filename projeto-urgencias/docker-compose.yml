services:
  db:
    image: postgres:16
    container_name: urgencias_db
    restart: always
    environment:
      POSTGRES_DB: hospital_urgencias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: urgencias_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: hospital_urgencias
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: urgencias_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data: